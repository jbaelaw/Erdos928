version: "v0.4"

project:
  name: "Erdős Problem 928 as a corollary of the joint Dickman law"
  description: >-
    An explicit finite counting bound compares strict shifted smoothness
    thresholds with weak thresholds based at the same integer. For any
    natural-valued function P and positive real a,b, the two counts through
    real X differ by at most floor(X^a)+floor((X+1)^b). For 0<a,b<1 this
    transfers any ordinary natural-density limit unchanged. With P the
    largest prime factor, the formalization proves the implication from the
    joint Dickman law to the exact two-variable statement of Erdős Problem
    928. The analytic joint law is an explicit hypothesis of that implication;
    it is supplied in the accompanying note by OpenAI result family 012,
    Theorem 1.1. No independent proof of that analytic theorem is claimed.
  authors:
    - "JI HO BAE"
  responsible_maintainers:
    - "JI HO BAE"
  license: "Apache-2.0"

sources:
  - title: "Erdős Problem 928 as a corollary of OpenAI's joint Dickman law"
    authors: ["JI HO BAE"]
    id: "https://github.com/jbaelaw/Erdos928/blob/main/paper/erdos928_note.pdf"
    type: "paper"
    location: "Corollary 1 and estimate (2)"
    relationship: "formalizes"
    note: "The short note accompanying this repository; no claim of worldwide priority."
    author_endorsement: "participated"
  - title: "The joint Dickman law for consecutive integers"
    authors: ["OpenAI"]
    id: "https://github.com/openai/math/blob/fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb/preprints/The-joint-Dickman-law-for-consecutive-integers-September-24-2026/paper.pdf"
    type: "paper"
    location: "Result family 012; Theorem 1.1, page 2"
    relationship: "adapts"
    note: >-
      Its joint-density statement motivates the explicit premise of the final
      implication. Its proof is neither imported nor re-proved. The new
      counting and density-transfer arguments use Mathlib only.
    author_endorsement: "not-contacted"
  - title: "Erdős Problem 928"
    authors: ["T. F. Bloom"]
    id: "https://www.erdosproblems.com/928"
    type: "web discussion"
    location: "The two-variable problem statement and predicted product density"
    relationship: "adapts"
    note: "The higher-order generalization mentioned on the page is outside the claim."
    author_endorsement: "not-contacted"

