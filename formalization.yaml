automation:
  methods:
    - method: "agent"
      framework: "Codex"
      tool_setup: "Lean 4, Mathlib, source inspection, and compilation on a remote Linux host."
      prompting_notes: >-
        The human requested an explicit, short, accurately cited note linking
        OpenAI's theorem to Problem 928, followed by a comprehensive audit and
        complete Lean formalization of the note's claims.
  notes: >-
    A Codex agent drafted the mathematics, paper, and Lean implementation under
    JI HO BAE's direction, checked references against their primary sources,
    and repaired elaboration errors. Model build identifiers and costs were
    not recorded. No separate independent agent or human review is claimed.

fidelity:
  divergences: >-
    The finite counting estimate and density transfer are proved for an
    arbitrary natural-valued P. The final implication specializes P to
    Nat.maxPrimeFac and leaves the density-value function rho explicit. Thus
    the analytic joint law is a mathematical hypothesis, not a custom axiom.
    No continuity of rho, quantitative analytic error term, or higher-order
    independence is assumed or concluded.

review:
  status: "self-assessed"
  notes: >-
    Mathematical statements, quantifiers, references, and prose were checked
    during development, and the Lean proofs were compiled with their axiom
    dependencies inspected. This is not a claim of independent human peer
    review. Comparator and Palomar's mechanical reports are separate evidence.

