name = "erdos928full"
version = "0.1.0"
defaultTargets = ["FullSolution"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "b84a70d6a5ed793cc46184160f4d4188d8c825fb"

[[lean_lib]]
name = "Architect"
srcDir = "vendor/upstream"
globs = ["Architect", "Architect.+"]
leanOptions = {autoImplicit = true}

[[lean_lib]]
name = "OAI"
srcDir = "vendor/upstream"
globs = ["OAI.+"]

[[lean_lib]]
name = "PrimeNumberTheoremAnd"
srcDir = "vendor/upstream"
globs = ["PrimeNumberTheoremAnd.+"]

[[lean_lib]]
name = "StrongPNT"
srcDir = "vendor/upstream"
globs = ["StrongPNT.+"]

[[lean_lib]]
name = "ConventionTransfer"

[[lean_lib]]
name = "FullSolution"

[[lean_lib]]
name = "FullChallenge"

[[lean_lib]]
name = "Erdos928Compat"
srcDir = "vendor/upstream"
globs = ["Erdos928Compat.+"]
